version: '3.9'
services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./client/dist:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: always

  api:
    image: ${ECR_IMAGE:-inference-app:latest}
    env_file:
      - ${ENV_FILE:-server/.env}
    restart: always
    command: ["node", "dist/server.js"]
    deploy:
      replicas: 2

  worker:
    image: ${ECR_IMAGE:-inference-app:latest}
    env_file:
      - ${ENV_FILE:-server/.env}
    restart: always
    command: ["node", "dist/workerEntry.js"]
